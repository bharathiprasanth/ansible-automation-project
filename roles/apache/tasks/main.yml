---
- name: Install Apache Web Server
  dnf:
    name: httpd
    state: present

- name: Deploy Apache Configuration
  template:
    src: servername.conf.j2
    dest: /etc/httpd/conf.d/servername.conf
    owner: root
    group: root
    mode: '0644'
  notify: Restart Apache

- name: Start Apache Service
  service:
    name: httpd
    state: started
    enabled: true
